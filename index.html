<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bubu Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: sticky shop header, 2-column product grid, bottom cart bar that opens an order sheet (WhatsApp + UPI). */
:root {
  --bg: #f5f6f2;
  --surface: #ffffff;
  --ink: #16201c;
  --muted: #5d6a64;
  --line: #dfe3dc;
  --accent: #0b7a5e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe8;
  --warn: #b4540a;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1613; --surface: #18221e; --ink: #eaf1ed; --muted: #9baba3; --line: #2a3832;
    --accent: #3fbf9a; --accent-ink: #06231a; --accent-soft: #1d3a31; --warn: #f0a15c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1613; --surface: #18221e; --ink: #eaf1ed; --muted: #9baba3; --line: #2a3832;
  --accent: #3fbf9a; --accent-ink: #06231a; --accent-soft: #1d3a31; --warn: #f0a15c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 0 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 920px; margin: 0 auto; }
header { padding-block: 20px 8px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -0.02em; margin: 0; }
.tag { color: var(--muted); margin: 2px 0 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 500 14px var(--font-body); padding: 8px 14px; border-radius: 999px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.note {
  background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--ink); margin-block: 4px 12px;
}
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ph {
  aspect-ratio: 1 / 1; display: grid; place-items: center; max-width: 100%;
  font: 800 54px var(--font-display); color: rgba(255,255,255,.92);
}
.ph { position: relative; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pg { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 999px; pointer-events: none; }
.body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.name { font-weight: 700; font-size: 15px; line-height: 1.25; margin: 0; }
.desc { color: var(--muted); font-size: 13px; margin: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 8px; }
.price { font: 800 18px var(--font-display); font-variant-numeric: tabular-nums; }
.btn {
  border: 0; background: var(--accent); color: var(--accent-ink); font: 700 14px var(--font-body);
  padding: 9px 14px; border-radius: 10px; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn:focus-visible, .chip:focus-visible, .qb:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.stepper { display: inline-flex; align-items: center; gap: 2px; background: var(--accent-soft); border-radius: 10px; }
.qb { border: 0; background: transparent; color: var(--ink); font: 700 18px var(--font-body); width: 34px; height: 36px; cursor: pointer; border-radius: 10px; }
.qn { min-width: 22px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
.bar .in { max-width: 920px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar b { font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.sheet {
  position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center;
}
.panel {
  background: var(--bg); width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto;
  border-radius: 18px 18px 0 0;
  padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
.panel h2 { font-family: var(--font-display); font-size: 22px; margin: 0 0 10px; }
.line { display: flex; justify-content: space-between; gap: 10px; padding-block: 8px; border-bottom: 1px solid var(--line); align-items: center; }
.line span:first-child { min-width: 0; overflow-wrap: anywhere; }
.total { display: flex; justify-content: space-between; font: 800 20px var(--font-display); padding-block: 12px; font-variant-numeric: tabular-nums; }
label { display: block; font-size: 13px; color: var(--muted); margin-block: 8px 4px; }
input[type="text"], input[type="tel"] {
  width: 100%; font: 400 16px var(--font-body); padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.actions { display: grid; gap: 10px; margin-top: 12px; }
.actions .btn, .actions a.btn { text-align: center; text-decoration: none; padding: 13px 14px; font-size: 15px; display: block; }
.upi { background: var(--surface); border: 1px dashed var(--accent); border-radius: 12px; padding: 12px; margin-top: 12px; }
.upi code { font: 700 16px var(--font-body); word-break: break-all; }
.upi .r { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.small { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.x { float: right; }
.empty { color: var(--muted); padding-block: 20px; text-align: center; }
footer { color: var(--muted); font-size: 12.5px; padding-block: 24px 8px; }
</style>

<div class="wrap">
  <header>
    <h1 class="brand" id="shopName">Bubu Store</h1>
    <p class="tag" id="shopTag">Haath se bune crochet products. WhatsApp pe order karo.</p>
    <div class="chips" id="chips" role="group" aria-label="Category"></div>
  </header>
  <main class="grid" id="grid"></main>
  <footer>Order WhatsApp pe confirm hota hai. Payment ki detail WhatsApp pe milegi.</footer>
</div>

<div class="bar" id="bar" hidden>
  <div class="in">
    <div><div id="barCount" class="small" style="margin:0"></div><b id="barTotal"></b></div>
    <button class="btn" id="openCart" type="button">Order karo</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
    <button class="btn ghost x" id="closeCart" type="button">Band karo</button>
    <h2 id="cartTitle">Aapka order</h2>
    <div id="lines"></div>
    <div class="total"><span>Total</span><span id="grand"></span></div>
    <label for="cName">Aapka naam</label>
    <input type="text" id="cName" autocomplete="name" placeholder="Naam likho">
    <label for="cAddr">Address / shehar</label>
    <input type="text" id="cAddr" autocomplete="street-address" placeholder="Delivery address">
    <div class="actions">
      <a class="btn" id="wa" href="#" target="_blank" rel="noopener">WhatsApp pe order bhejo</a>
    </div>
    <div class="upi" id="upiBox">
      <div class="small" style="margin:0 0 6px">Pay karne ke liye UPI number (PhonePe, GPay, Paytm)</div>
      <div class="r"><code id="upiId"></code><button class="btn ghost" id="copyUpi" type="button">Copy</button></div>
      <p class="small">Amount <b id="upiAmt"></b> bhejo, phir WhatsApp pe screenshot share karo.</p>
    </div>
  </div>
</div>

var cart = {};
var cat = "Sab";
function $(id) { return document.getElementById(id); }
function rs(n) { return "₹" + n.toLocaleString("en-IN"); }
function byId(id) { for (var i = 0; i < PRODUCTS.length; i++) if (PRODUCTS[i].id === id) return PRODUCTS[i]; return null; }

function chips() {
  var cats = ["Sab"];
  PRODUCTS.forEach(function (p) { if (cats.indexOf(p.cat) < 0) cats.push(p.cat); });
  $("chips").innerHTML = cats.map(function (c) {
    return '<button type="button" class="chip" data-cat="' + c + '" aria-pressed="' + (c === cat) + '">' + c + "</button>";
  }).join("");
}
function grid() {
  $("grid").innerHTML = PRODUCTS.filter(function (p) { return cat === "Sab" || p.cat === cat; }).map(function (p) {
    var q = cart[p.id] || 0;
    var ph = p.imgs && p.imgs.length ? '<img src="' + p.imgs[0] + '" alt="' + p.name + '"' + (p.imgs.length > 1 ? ' data-gal="' + p.id + '" data-i="0" style="cursor:pointer"' : '') + '>' : p.name.charAt(0);
    var badge = p.imgs && p.imgs.length > 1 ? '<span class="pg">1/' + p.imgs.length + '</span>' : '';
    var ctl = q
      ? '<div class="stepper"><button class="qb" type="button" data-dec="' + p.id + '" aria-label="Kam karo">−</button><span class="qn">' + q + '</span><button class="qb" type="button" data-inc="' + p.id + '" aria-label="Badhao">+</button></div>'
      : '<button class="btn" type="button" data-inc="' + p.id + '">Add</button>';
    return '<article class="card"><div class="ph" style="background:' + p.color + '">' + ph + badge + '</div><div class="body"><h3 class="name">' + p.name +
      '</h3><p class="desc">' + p.desc + '</p><div class="row"><span class="price">' + rs(p.price) + "</span>" + ctl + "</div></div></article>";
  }).join("");
}
function totals() {
  var n = 0, t = 0;
  Object.keys(cart).forEach(function (k) { var p = byId(+k); n += cart[k]; t += cart[k] * p.price; });
  return { n: n, t: t };
}
function summary() {
  var s = totals();
  $("bar").hidden = s.n === 0;
  $("barCount").textContent = s.n + (s.n === 1 ? " item" : " items");
  $("barTotal").textContent = rs(s.t);
}
function lines() {
  var s = totals();
  var keys = Object.keys(cart);
  $("lines").innerHTML = keys.length ? keys.map(function (k) {
    var p = byId(+k);
    return '<div class="line"><span>' + p.name + " × " + cart[k] + "</span><span>" + rs(p.price * cart[k]) + "</span></div>";
  }).join("") : '<div class="empty">Cart khali hai.</div>';
  $("grand").textContent = rs(s.t);
  $("upiAmt").textContent = rs(s.t);
  $("upiId").textContent = SHOP.upi;
  $("upiBox").hidden = !SHOP.upi;
  var msg = "Namaste! Mujhe ye order karna hai:\n";
  keys.forEach(function (k) { var p = byId(+k); msg += "- " + p.name + " x " + cart[k] + " = " + rs(p.price * cart[k]) + "\n"; });
  msg += "Total: " + rs(s.t) + "\nNaam: " + ($("cName").value || "-") + "\nAddress: " + ($("cAddr").value || "-");
  $("wa").href = "https://wa.me/" + SHOP.whatsapp + "?text=" + encodeURIComponent(msg);
}
function render() { grid(); summary(); }

document.addEventListener("click", function (e) {
  var g = e.target.closest("img[data-gal]");
  if (g) {
    var gp = byId(+g.dataset.gal), gi = (+g.dataset.i + 1) % gp.imgs.length;
    g.src = gp.imgs[gi]; g.dataset.i = gi;
    g.parentNode.querySelector(".pg").textContent = (gi + 1) + "/" + gp.imgs.length;
    return;
  }
  var t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.cat) { cat = t.dataset.cat; chips(); grid(); return; }
  if (t.dataset.inc) { var a = +t.dataset.inc; cart[a] = (cart[a] || 0) + 1; render(); return; }
  if (t.dataset.dec) { var b = +t.dataset.dec; cart[b] = (cart[b] || 0) - 1; if (cart[b] <= 0) delete cart[b]; render(); return; }
});
